name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys. For security issues use the private "Report a vulnerability" link instead.
  - type: input
    id: version
    attributes:
      label: stock-images-mcp version
      placeholder: "2.0.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Node.js version, OS and MCP client
      placeholder: "Node 22, macOS 15, Claude Desktop"
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider involved
      multiple: true
      options: [Pexels, Unsplash, Pixabay, None / not sure]
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The tool called, its arguments (without keys) and the output or error.
    validations:
      required: true
